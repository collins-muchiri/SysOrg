name: Diag

# v3.0.1: TEMPORARY ground-truth probe for two Windows-only test failures
# (project-folder detection and the offline catalog read). Delete once green.
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trace project-folder detection and catalog read on PS 5.1
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force -ErrorAction SilentlyContinue
          if(-not (Get-Module Pester)){ Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck }
          Import-Module Pester -RequiredVersion 5.7.1
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = '.\Tools\Diag.Tests.ps1'
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
